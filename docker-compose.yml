# DeepSeek V4 Flash 0731 — vLLM TP=2 across two DGX Sparks (ConnectX-7 RoCE)
# Based on github.com/anemll/dspark-vllm-gx10 (MIT), trimmed and adapted.
# Same file on both nodes; rank-specific values come from head.env / worker.env.
name: dsv4-flash

services:
  vllm:
    image: ${VLLM_IMAGE}
    pull_policy: if_not_present
    container_name: dsv4-flash
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: "64gb"
    restart: "no"
    gpus: all
    ulimits:
      memlock: -1
      stack: 67108864
    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${MODEL_DIR}:/models/dsv4:ro
      - ${HF_CACHE}:/cache/huggingface
      - ${JIT_TMP}:/tmp

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      VLLM_HOST_IP: ${VLLM_HOST_IP}
      VLLM_API_KEY: ${VLLM_API_KEY:-}

      # --- GB10 / DSpark runtime knobs (anemll defaults) ---
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_TRITON_MLA_SPARSE: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_SKIP_INIT_MEMORY_CHECK: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_USE_B12X_WO_PROJECTION: "1"
      VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "0"
      VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "16"
      B12X_W4A16_TC_DECODE: "0"
      DSPARK_SLOT_CLAMP: "1"
      VLLM_DSPARK_CONFIDENCE_THRESHOLD: "0.0"
      VLLM_DSPARK_CONFIDENCE_SCHEDULER: "off"
      VLLM_DSPARK_LOCAL_ARGMAX: "1"
      VLLM_DSPARK_REPLICATE_MARKOV_W1: "1"
      VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: "1"
      VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP: "1"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      FLASHINFER_WORKSPACE_BASE: /cache/huggingface/flashinfer
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

      # --- NCCL over ConnectX-7 RoCE v2 ---
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: ${NCCL_IB_HCA}
      NCCL_SOCKET_IFNAME: ${FABRIC_IF}
      TP_SOCKET_IFNAME: ${FABRIC_IF}
      GLOO_SOCKET_IFNAME: ${FABRIC_IF}
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_NVLS_ENABLE: "0"
      NCCL_DEBUG: ${NCCL_DEBUG:-WARN}

    command:
      - bash
      - -lc
      - >
        export PATH="/usr/local/cuda/bin:$${PATH:-}";
        export CUDA_HOME=/usr/local/cuda;
        ENC=/models/dsv4/encoding/encoding_dsv4.py;
        DST=/usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4_encoding.py;
        if [ -f "$${ENC}" ] && [ -d "$$(dirname $${DST})" ]; then cp "$${ENC}" "$${DST}" && echo "[dsv4] installed 0731 chat encoder"; else echo "[dsv4] WARN: 0731 encoder not installed" >&2; fi;
        SPEC="{\"method\":\"dspark\",\"num_speculative_tokens\":${MTP_NUM_TOKENS},\"draft_sample_method\":\"probabilistic\"}";
        exec /usr/local/bin/vllm serve /models/dsv4
        --served-model-name ${SERVED_MODEL_NAME}
        --host ${API_HOST}
        --port ${API_PORT}
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --distributed-executor-backend mp
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT}
        --kv-cache-dtype nvfp4_ds_mla
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN}
        --max-num-seqs ${MAX_NUM_SEQS}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS}
        --max-cudagraph-capture-size $$(( ${MAX_NUM_SEQS} * (${MTP_NUM_TOKENS} + 1) ))
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION}
        --enable-prefix-caching
        --enable-chunked-prefill
        --async-scheduling
        --speculative-config "$${SPEC}"
        --tokenizer-mode deepseek_v4
        --moe-backend flashinfer_b12x
        --enable-flashinfer-autotune
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        --default-chat-template-kwargs '{"thinking":${DEFAULT_THINKING}}'
        --generation-config vllm
        --jit-monitor-mode warn
        ${HEADLESS:+--headless}
